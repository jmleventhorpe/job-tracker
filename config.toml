# Community job sheet -> Notion Job Tracker
# Edit this file to change sources and filtering. No code changes or image
# rebuild needed: Docker mounts it, so edits apply on the next run.

[state]
# Local record of postings already handled, so a row you rename or delete in
# Notion is not added again. Mounted from ./data in Docker.
db_path = "data/seen.db"

# One [[sources]] table per place jobs come from. `name` is written to the
# Notion Source column. Add more tables to pull from more places.
[[sources]]
type = "google_sheet"
name = "Community Sheet"
# "Openings" tab of the community job postings sheet (gid=0).
spreadsheet_id = "1eR2oAXOuflr8CZeGoz3JTrsgNj3KuefbdXJOmNtjEVM"
gid = 0
# Tried in order. Day-first, so 03/04/2026 is 3 April.
date_formats = ["%B %d, %Y", "%b %d, %Y", "%d %B %Y", "%Y-%m-%d", "%d/%m/%Y"]

# Uncomment to override a header if the sheet renames a column. Matched
# case-insensitively against the start of the header text.
# [sources.columns]
# title = "job title"
# url = "source/contact"

[filters]
# A row is kept when its job title contains one of these as a whole word
# (case-insensitive, so "lighting" does not match "highlighting"; symbols
# are fine, e.g. "c++").
title_keywords = [
    "rigging",
    "rigger",
    "creature td",
    "creature technical director",
    "lighting artist",
    "lighting",
    "pipeline",
    "generalist",
    # "technical artist" left out: almost all are games tech art roles.
    # Ones titled e.g. "Technical Artist, Rigging" still match "rigging".
    "technical director",
    "character td",
    "lookdev",
    "look dev",
    "look development",
    "tools developer",
    "tools td",
]

# Dropped even if the title matched above. FX is a different discipline
# (simulation work), so "FX / Lighting TD" style titles are excluded.
title_exclusions = [
    "fx td",
    "fx technical director",
    "effects technical director",
    "fx artist",
    "fx supervisor",
    "fx lead",
    "effects td",
    "effects artist",
    "cfx",
    "crowd",
    "hr",       # HR Generalist etc.
]

# Rows whose title misses the list above are still kept if the Software column
# mentions one of these AND the location passes. Empty = disabled. Left empty
# deliberately: Houdini-heavy adverts are usually FX roles.
software_keywords = []

# Remote rows are kept when their location is blank or only says one of
# remote_words. A remote role tied to a country not in [locations] is dropped.
keep_remote_without_country = true
remote_words = ["remote", "worldwide", "anywhere", "global"]

# Skip postings dated more than this many days ago. Rows with no parseable
# date are kept, since their age can't be judged. 0 = no limit.
max_age_days = 90

[scoring]
# After the filters above, each NEW posting is scored 0-10 by Claude against
# the profile below. The score, discipline and reason go into Notion. Each
# posting is scored once (the seen store remembers it). Needs
# ANTHROPIC_API_KEY in .env. Set enabled = false to use keywords only.
enabled = true
model = "claude-opus-5-5"   # "claude-haiku-5-5" is far cheaper, a weaker judge
effort = "low"              # low | medium | high | xhigh | max
# Postings scoring below this are recorded as seen but not added to Notion.
min_score = 6
max_workers = 4             # parallel scoring requests
disciplines = ["Rigging", "Lighting", "Pipeline", "Technical Art", "Generalist", "Other"]

# Write this like you'd brief a recruiter. Edit freely; it is the main way to
# steer what gets through. The keywords above only decide what gets scored.
profile = """
Mid-to-senior technical artist with about 8 years in feature and series
animation, across three disciplines: lighting/lookdev, character rigging and
pipeline development. Strongest where art and code meet.

Background:
- Lighting and lookdev: shot and sequence lighting in Houdini Solaris (LOPs)
  with Arnold; character lookdev; RenderMan, V-Ray, Substance, OCIO/ACES.
  Lookdev roles count as Lighting.
- Rigging: full-body, facial and cloth character rigs in Maya, mGear and
  modular rigging systems, with Python/OpenMaya rigging tools.
- Pipeline: about 3 years as a pipeline developer. Built a studio-wide
  publish validation tool, asset/shot manager infrastructure, USD
  integration, Maya/Houdini/Blender handoff and shot assembly automation,
  PyQt tools. Python, C++, USD, ShotGrid, render farm (Royal Render,
  Tractor), Docker, Linux.
- DCCs: Maya, Houdini, Blender, Nuke, Unreal.

Good fits (score high):
- Lighting, lighting TD or lookdev artist roles, especially Solaris/USD
- Rigging, character TD or creature TD roles
- Pipeline TD, pipeline developer or tools developer roles in VFX,
  animation or games production
- 3D generalist roles at VFX, animation or games studios, especially ones
  that lean on lighting, lookdev or rigging
- Mid or senior level; junior roles only if otherwise a very strong match
- Animation and VFX studios first; games studios are fine

Not a fit (score low):
- Technical artist roles: these are almost always real-time games tech art
  (shaders, engine tools, performance). Only score one well if it is
  clearly rigging, lighting/lookdev or pipeline work
- FX / simulation / CFX / crowd roles, even when the title says TD
- Pure software engineering or IT roles outside a production pipeline
- Modelling, texturing-only, animation, compositing or 2D roles
- HR, production management, recruiting and other non-artist roles

Location and right to work: British citizen with full right to work in the
UK, currently based outside the UK. First score the role on fit alone, then
adjust for where it is (or where it can be done from, for remote roles):
- United Kingdom, or remote open to the UK: +1 (maximum score is still 10)
- Europe (EU, EEA, Switzerland, Ireland), Australia, New Zealand: no change
- Canada: -1
- United States, Mexico, South America, Asia: -2
If a location is unclear, use the closest match from this list.
"""

[locations]
# Matched against both the Country and the Province/State/Region columns,
# because the sheet frequently swaps the two for UK rows. Cells are split on
# brackets and separators, so "United Kingdom (Remote)" matches "united kingdom".
allowed = [
    # UK
    "united kingdom", "uk", "england", "scotland", "wales", "northern ireland",
    # Canada
    "canada",
    # US
    "united states", "usa", "us", "united states of america",
    # Europe
    "ireland", "france", "germany", "spain", "portugal", "italy",
    "netherlands", "belgium", "luxembourg", "switzerland", "austria",
    "denmark", "sweden", "norway", "finland", "iceland",
    "poland", "czech republic", "czechia", "slovakia", "hungary",
    "romania", "bulgaria", "greece", "croatia", "slovenia", "serbia",
    "estonia", "latvia", "lithuania", "malta", "cyprus", "ukraine",
    # Australia and New Zealand
    "australia", "new zealand", "nz",
    # Mexico (scored like the US)
    "mexico", "méxico",
    # South America
    "brazil", "brasil", "argentina", "chile", "colombia", "peru", "uruguay",
    "ecuador", "paraguay", "bolivia", "venezuela",
    # Asia
    "japan", "south korea", "korea", "china", "hong kong", "taiwan",
    "singapore", "malaysia", "thailand", "vietnam", "philippines",
    "indonesia", "india", "nepal", "sri lanka", "bangladesh", "pakistan",
]

# Notion column names. Only needed if you rename a column in Notion;
# these are the defaults.
# [notion.properties]
# role = "Role"
# studio = "Studio"
# source = "Source"
# location = "Location"
# url = "Posting URL"
# date_issued = "Date Issued"
# experience = "Experience"
# work_mode = "Work Mode"
